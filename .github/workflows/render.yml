name: Render Pip episode
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto benchmarks CPU; economy is upscaled 3D; blender is native 1080p; fallback is illustrated'
        type: choice
        default: auto
        options: [auto, economy, blender, fallback]
permissions:
  contents: read
concurrency:
  group: pip-full-render
  cancel-in-progress: false
jobs:
  render:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install free CPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxi6 libxrender1 libxfixes3 libxkbcommon0 libgl1 libegl1 libsm6
          python -m pip install --no-cache-dir -r requirements-core.txt PyYAML==6.0.2
      - name: Install the Blender CPU renderer
        if: inputs.mode != 'fallback'
        continue-on-error: ${{ inputs.mode == 'auto' }}
        run: python -m pip install --no-cache-dir bpy==4.2.23
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Generate and verify the full episode
        run: python -m factory.render --mode "$MODE" --out build/episode --threads 4 --budget-seconds 4500
      - name: Publish downloadable build outputs on a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="episode-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/release_notes.py > build/release-notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Pip episode build $GITHUB_RUN_NUMBER" --notes-file build/release-notes.md build/episode/*.mp4 build/episode/*.json build/episode/story-*.jpg
      - name: Write verification summary
        if: always()
        run: python scripts/job_summary.py
